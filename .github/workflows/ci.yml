name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff==0.8.6' 'mypy==1.14.1'
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy

  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[download]' 'coverage[toml]==7.6.1' 'hypothesis==6.113.0'
      - name: Unit tests (offline; every extra installed, so no test may be skipped)
        run: python -m coverage run scripts/ci/run_tests.py --fail-on-skip --verbosity 2
      - name: Coverage, whole package (fail_under in pyproject)
        run: python -m coverage report
      - name: Coverage, core domain modules (>= 90%)
        run: >-
          python -m coverage report --fail-under=90
          --include='src/paper_author_searcher/identity.py,src/paper_author_searcher/resolver.py,src/paper_author_searcher/matching.py,src/paper_author_searcher/paper_ownership.py,src/paper_author_searcher/paper_deduplication.py,src/paper_author_searcher/paper_collector.py,src/paper_author_searcher/workflow/*.py,src/paper_author_searcher/composition.py,src/paper_author_searcher/settings.py,src/paper_author_searcher/models.py,src/paper_author_searcher/status.py,src/paper_author_searcher/registry.py'
      - name: Benchmark dataset integrity (offline)
        # Fails when the roster is malformed, a stratum is too small, or a person lacks snapshots/truth.
        run: paper-benchmark validate

  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: The image builds
        run: docker build -t paper-author-searcher:ci .
      - name: The image's commands run
        run: |
          docker run --rm paper-author-searcher:ci --help > /dev/null
          docker run --rm paper-author-searcher:ci backup --help > /dev/null
      - name: The compose file is valid in every profile
        run: |
          mkdir -p deploy/secrets deploy/backups
          touch deploy/secrets/ALERT_SMTP_PASSWORD
          cp deploy/alertmanager/alertmanager.example.yml deploy/alertmanager/alertmanager.yml
          docker compose -f deploy/compose.yaml --profile public --profile s3 --profile monitoring config --quiet
      - name: The Caddyfile, Prometheus and Alertmanager configurations load
        run: |
          docker run --rm -e SITE_ADDRESS=example.com -v "$PWD/deploy/caddy:/etc/caddy:ro" caddy:2.8.4 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" -v "$PWD/deploy/secrets:/run/secrets:ro" prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml
