name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install 'ruff==0.8.6' 'mypy==1.14.1'
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy

  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[download]'
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Benchmark dataset integrity (offline)
        # Fails when the roster is malformed, a stratum is too small, or a person lacks snapshots/truth.
        run: paper-benchmark validate
