[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-author-searcher"
version = "0.1.0"
description = "Evidence-based professor identity resolution across scholarly indexes"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
download = ["pypdf>=5.9,<6"]
# Optional identity adjudication with Claude; the Anthropic SDK 1.x requires Python >= 3.10.
llm = ["anthropic>=1; python_version >= '3.10'"]
dev = ["ruff==0.8.6", "mypy==1.14.1", "pre-commit==3.5.0"]

[project.scripts]
professor-resolve = "paper_author_searcher.cli:main"
paper-evaluate = "paper_author_searcher.evaluation_cli:main"
pdf-resolve = "paper_author_searcher.pdf_cli:main"
pdf-download = "paper_author_searcher.download_cli:main"
paper-search = "paper_author_searcher.workflow_cli:main"
paper-performance = "paper_author_searcher.performance_cli:main"
paper-benchmark = "paper_author_searcher.benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 120
src = ["src", "tests", "scripts"]
extend-exclude = ["output", "data", "reports", "tmp"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PIE", "RET", "TID"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # non-ASCII text is intentional (author names, Chinese docs)
    "SIM108",                       # ternaries are not always clearer
    "RET504", "RET505",             # explicit assignments before return/else aid readability here
    "B905",                         # zip(strict=) needs Python 3.10
]

[tool.ruff.lint.isort]
known-first-party = ["paper_author_searcher"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
# Python 3.8 has no parenthesized multi-item `with`; nested mock.patch blocks read better than one long line.
"tests/**" = ["SIM117"]
