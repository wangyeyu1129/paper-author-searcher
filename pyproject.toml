disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.coverage.run]
branch = true
source = ["src/paper_author_searcher"]

[tool.coverage.report]
# Whole package: no regression below today's level. Core domain modules have their own, higher gate in CI.
fail_under = 84
skip_covered = true
