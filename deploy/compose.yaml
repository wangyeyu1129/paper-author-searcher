# docker compose -f deploy/compose.yaml up -d                       API + worker + index refresh
# docker compose -f deploy/compose.yaml --profile s3 up -d          ... with MinIO as the PDF store
# docker compose -f deploy/compose.yaml --profile monitoring up -d  ... with Prometheus and the alert rules
# docker compose -f deploy/compose.yaml up -d --scale worker=3      more searches at once
name: paper-search

x-service: &service
  image: paper-author-searcher:latest
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  volumes:
    - data:/data
  restart: unless-stopped

services:
  api:
    <<: *service
    # Searches run in the worker service; the API only queues and answers.
    command: ["serve", "--workers", "0"]
    ports:
      - "8080:8080"

  worker:
    <<: *service
    command: ["worker", "--threads", "1"]
    healthcheck:
      disable: true
    # A stopped worker's running search is queued again after service.stale_after_seconds.
    stop_grace_period: 30s

  indexer:
    <<: *service
    # Rebuild the DBLP index when dblp.org publishes a new dump (checked weekly) and refresh the catalogs.
    command: ["refresh-indexes", "--every-hours", "168"]
    healthcheck:
      disable: true

  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/storage", "--console-address", ":9001"]
    env_file:
      - path: .env
        required: false
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage:/storage
    restart: unless-stopped

  bucket:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set store http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
        mc mb --ignore-existing store/paper-search

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  data:
  storage:
