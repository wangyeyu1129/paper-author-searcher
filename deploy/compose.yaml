# Nothing here listens on a public interface except Caddy (profile "public"); the rest binds to 127.0.0.1.
#
# docker compose -f deploy/compose.yaml up -d                       API + worker + index refresh + backups
# docker compose -f deploy/compose.yaml --profile public up -d      ... with HTTPS on ports 80 and 443 (SITE_ADDRESS)
# docker compose -f deploy/compose.yaml --profile s3 up -d          ... with an S3-compatible store for PDFs
# docker compose -f deploy/compose.yaml --profile monitoring up -d  ... with Prometheus and Alertmanager
# docker compose -f deploy/compose.yaml up -d --scale worker=3      more searches at once
name: paper-search

x-service: &service
  # A release pins this in deploy/.env, for example ghcr.io/owner/paper-author-searcher:v1.2.0; rolling back is
  # setting the previous tag and running up -d again.
  image: ${PAPER_SEARCH_IMAGE:-paper-author-searcher:latest}
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  # Secrets: a file named after the variable in SECRETS_DIRECTORY wins; otherwise they pass through from the shell or
  # deploy/.env, so they need not be written anywhere else.
  environment:
    PAPER_SEARCH_SECRETS_DIRECTORY: /run/secrets
    OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
    CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
    CORE_API_KEY: ${CORE_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    EXA_API_KEY: ${EXA_API_KEY:-}
    OPENREVIEW_TOKEN: ${OPENREVIEW_TOKEN:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  volumes:
    - data:/data
    - ${SECRETS_DIRECTORY:-./secrets}:/run/secrets:ro
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: 50m, max-file: "5"}

services:
  api:
    <<: *service
    # Searches run in the worker service; the API only queues and answers.
    command: ["serve", "--workers", "0"]
    ports:
      - "127.0.0.1:${API_LOCAL_PORT:-8080}:8080"

  worker:
    <<: *service
    command: ["worker", "--threads", "1"]
    healthcheck:
      disable: true
    # A stopped worker's running search is queued again after service.stale_after_seconds.
    stop_grace_period: 30s

  indexer:
    <<: *service
    # Rebuild the DBLP index when dblp.org publishes a new dump (checked weekly) and refresh the catalogs.
    command: ["refresh-indexes", "--every-hours", "168"]
    healthcheck:
      disable: true

  backup:
    <<: *service
    # Archives the jobs database, API keys and local files; copy deploy/backups off this machine (docs/deployment.md).
    command: ["backup", "--output", "/backups", "--keep", "${BACKUP_KEEP:-14}", "--every-hours", "${BACKUP_EVERY_HOURS:-24}"]
    volumes:
      - data:/data
      - ${SECRETS_DIRECTORY:-./secrets}:/run/secrets:ro
      - ${BACKUP_DIRECTORY:-./backups}:/backups
    healthcheck:
      disable: true

  caddy:
    profiles: ["public"]
    image: caddy:2.8.4
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging

  storage:
    # S3-compatible object store for the PDFs (Versity S3 Gateway over a volume; it checks SigV4 signatures).
    # In production point S3_ENDPOINT at AWS S3, Cloudflare R2 or your own store instead.
    profiles: ["s3"]
    image: versity/versitygw:v1.9.0
    command: ["posix", "/storage"]
    environment:
      ROOT_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      ROOT_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - storage:/storage
    restart: unless-stopped

  bucket:
    <<: *service
    profiles: ["s3"]
    depends_on: [storage]
    command: ["create-bucket"]
    restart: on-failure
    healthcheck:
      disable: true

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging: *logging

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    # The secrets directory belongs to the service's user. Silences are lost on a restart; alert routes are in the file.
    user: "10001"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/tmp/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ${SECRETS_DIRECTORY:-./secrets}:/run/secrets:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  storage:
  prometheus:
  caddy_data:
  caddy_config:
